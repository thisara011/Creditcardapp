    <line x1="100" y1="1180" x2="1100" y2="1180" stroke="#374151" stroke-width="1.5" />
    <line x1="100" y1="1260" x2="1100" y2="1260" stroke="#374151" stroke-width="1.5" />
    <line x1="100" y1="1340" x2="1100" y2="1340" stroke="#374151" stroke-width="1.5" />
    <line x1="100" y1="1420" x2="1100" y2="1420" stroke="#374151" stroke-width="1.5" />

