        <line x1="500" y1="270" x2="500" y2="890" />
        <line x1="100" y1="330" x2="1100" y2="330" />
        <line x1="100" y1="390" x2="1100" y2="390" />
        <line x1="100" y1="450" x2="1100" y2="450" />
        <line x1="100" y1="510" x2="1100" y2="510" />
        <line x1="100" y1="570" x2="1100" y2="570" />
        <line x1="100" y1="630" x2="1100" y2="630" />
        <line x1="100" y1="760" x2="1100" y2="760" />
    </g>

    <text x="130" y="312" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">1</text>
    <text x="190" y="312" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">
        Name</text>
    <text x="130" y="372" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">2</text>
    <text x="190" y="372" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">
